services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-taller}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - barberia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Configura DB_PASSWORD}
      - DB_NAME=${DB_NAME:-taller}
      - JWT_SECRET=${JWT_SECRET:?Configura JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_ORIGIN:-http://localhost:3000}}
      - DATABASE_URL=postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:?Configura DB_PASSWORD}@postgres:5432/${DB_NAME:-taller}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - barberia_network
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: npm run dev

  # Explicit maintenance step: docker compose --profile maintenance run --rm migrate
  migrate:
    profiles: ["maintenance"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:?Configura DB_PASSWORD}@postgres:5432/${DB_NAME:-taller}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - barberia_network
    command: ["npx", "prisma", "migrate", "deploy"]

  # Demo data is an explicit action and seed.ts refuses a populated database.
  seed-demo:
    profiles: ["demo"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:?Configura DB_PASSWORD}@postgres:5432/${DB_NAME:-taller}
      NODE_ENV: ${NODE_ENV:-development}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - barberia_network
    command: ["npm", "run", "db:seed"]

  # Frontend Service
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - barberia_network
    volumes:
      - ./Frontend/src:/app/src
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  barberia_network:
    driver: bridge
